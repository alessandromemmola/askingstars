        .skiptranslate {
            display: none !important;

            overflow: hidden !important;
        }

        body { top: 0 !important; }

        .widget-header {
            background: linear-gradient(135deg, #ff4c81, #c2185b);
            border-radius: 12px;
            padding: 14px 20px;
            margin-bottom: 16px;
            color: white;
        }

        .widget-header h1 {
            font-size: 1.2rem;
            font-style: italic;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .widget-header p {
            font-size: 0.68rem;
            opacity: 0.8;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 3px;
        }

        h2 { color: #ff4c81; font-size: 1.15em; margin: 14px 0 8px; }
        h3 { color: #c2185b; font-size: 0.78rem; text-transform: uppercase;
             letter-spacing: 1px; margin: 12px 0 5px; }

        #risposta {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #333;
            padding: 4px 2px;
        }

        #risposta p {
            font-style: italic;
            color: #4b0082;
            background: #fdf0f8;
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 4px;
            text-align: left;
        }

        #loading {
            margin: 30px 0;
            font-size: 0.95rem;
            color: #ff69b4;
            font-weight: bold;
        }

        .spinner {
            width: 36px; height: 36px;
            border: 4px solid #f3d0e8;
            border-top-color: #ff69b4;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 14px auto 0;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #ff4c81, #c2185b);
            color: white;
            padding: 11px 22px;
            border-radius: 24px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            margin: 18px 0 6px;
            transition: opacity 0.2s, transform 0.15s;
        }

        .cta-button:hover { opacity: 0.9; transform: translateY(-1px); }

        footer {

            color: #bbb;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #f5e6f5;

    // Google Translate – solo per italiano
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'it',
            autoDisplay: false
        }, 'google_translate_element');
        setTimeout(() => {
            const select = document.querySelector('select.goog-te-combo');
            if (select) {
                select.value = 'it';
                select.dispatchEvent(new Event('change'));
            }
        }, 1000);
    }

    function rnd(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function getCachedOroscopo(segno) {
        try {
            const key = `oroscopo_${segno}_${new Date().toDateString()}`;
            return localStorage.getItem(key);
        } catch(e) { return null; }
    }

    function setCachedOroscopo(segno, oroscopo) {
        try {
            const key = `oroscopo_${segno}_${new Date().toDateString()}`;
            localStorage.setItem(key, oroscopo);
        } catch(e) {}
    }

    async function getOroscopo(segno, giorno, domandaKey, linguaParam) {
        const rispostaDiv = document.getElementById("risposta");
        const loading = document.getElementById("loading");

        loading.style.display = "block";
        loading.innerHTML = lingua === 'en'
            ? 'Consulting the stars… <div class="spinner"></div>'
            : 'Consultando le stelle… <div class="spinner"></div>';
        rispostaDiv.innerHTML = "";

        const lingua = traduzioni[linguaParam] ? linguaParam : 'it';
        const t = traduzioni[lingua];

        const nomeSegno = t.nomiSegni[segno] || segno;
        const emojiSegno = t.emojiSegni[segno] || '';
        const domandaTesto = t.domande[domandaKey] || domandaKey;

        try {
            rispostaDiv.innerHTML = `<h2>${emojiSegno} ${nomeSegno}</h2>`;

            if (giorno === "tomorrow") {
                rispostaDiv.innerHTML += `
                    <h3>${t.headers.yourQuestion}</h3>
                    <p>${domandaTesto}</p>
                    <h3>${t.headers.fortuneTellerSees}</h3>
                    <p>${rnd(t.cartomanteRisposte)}</p>
                `;
            } else {
                let oroscopo = getCachedOroscopo(segno);

                if (!oroscopo) {
                    const apiUrl = `https://askingstars.vercel.app/api/ninjas-horoscope?zodiac=${segno}`;
                    const res = await fetch(apiUrl);
                    if (!res.ok) {
                        const text = await res.text();
                        throw new Error(`Errore API: ${res.status} - ${text.substring(0, 200)}`);
                    }
                    const data = await res.json();
                    oroscopo = data.horoscope || "Le stelle sono un po' misteriose oggi...";
                    setCachedOroscopo(segno, oroscopo);
                }

                rispostaDiv.innerHTML += `
                    <h3>${t.headers.yourQuestion}</h3>
                    <p>${domandaTesto}</p>
                    <h3>${t.headers.todaysHoroscope}</h3>
                    <p>${oroscopo}</p>
                    <h3>${t.headers.interpretation}</h3>
                    <p>${rnd(t.risposteInterpretazione)}</p>
                    <h3>${t.headers.funnyReply}</h3>
                    <p>${rnd(t.frasiDivertenti)}</p>
                `;
            }

            const ctaLabel = lingua === 'en'
                ? 'Discover your full horoscope 🌟'
                : 'Scopri il tuo oroscopo completo 🌟';

            rispostaDiv.innerHTML += `
                <a href="https://askingstars.com" class="cta-button" target="_blank">
                    ${ctaLabel}
                </a>
            `;

        } catch (error) {
            console.error('Errore fetch:', error);
            rispostaDiv.innerHTML = `
                <h3>${t.headers.error}</h3>
                <p>${t.headers.starsConfused}<br><small>${error.message}</small></p>
            `;
        } finally {
            loading.style.display = "none";
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        const segno      = params.get('sign')     || 'aries';
        const giorno     = params.get('mode')     || 'today';
        const domandaKey = params.get('question') || 'energyToday';
        const lingua     = params.get('lang')     || 'it';

        if (lingua === 'it') {

            script.src = '//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
            document.body.appendChild(script);
        }

        getOroscopo(segno, giorno, domandaKey, lingua);
    });
