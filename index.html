<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AskingStars – Oroscopo Q&A divertente</title>
  <meta name="description" content="Chiedi alle stelle o alla cartomante risposte ironiche e personalizzate – AskingStars" />
  <link rel="icon" href="favicon.png" type="image/png" />
  <meta name="theme-color" content="#0d1117" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: linear-gradient(135deg, #161b22, #0d1117);
      padding: 60px 20px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 3.8rem;
      color: #58a6ff;
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      flex: 1;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 28px;
      margin: 24px 0;
    }
    button {
      background: #238636;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      margin: 12px 8px 0 0;
    }
    button:hover {
      background: #2ea043;
    }
    #risposta {
      margin-top: 24px;
      padding: 20px;
      background: #21262d;
      border-radius: 10px;
      min-height: 120px;
      white-space: pre-wrap;
    }
    footer {
      text-align: center;
      padding: 40px 20px;
      color: #8b949e;
      font-size: 0.95rem;
      border-top: 1px solid #21262d;
    }
    footer a {
      color: #58a6ff;
      text-decoration: none;
    }
  </style>
</head>
<body>

<header>
  <h1>AskingStars</h1>
  <p style="font-size:1.4rem; opacity:0.9;">Chiedi alle stelle o alla cartomante… e ridi un po’ 🌟</p>
</header>

<div class="container">

  <div class="card">
    <h2 style="margin-top:0">Oroscopo di oggi</h2>
    <p>Scegli il tuo segno zodiacale:</p>
    <button onclick="getOroscopo('ariete', 'today')">Ariete</button>
    <button onclick="getOroscopo('toro', 'today')">Toro</button>
    <button onclick="getOroscopo('gemelli', 'today')">Gemelli</button>
    <button onclick="getOroscopo('cancro', 'today')">Cancro</button>
    <button onclick="getOroscopo('leone', 'today')">Leone</button>
    <button onclick="getOroscopo('vergine', 'today')">Vergine</button>
    <button onclick="getOroscopo('bilancia', 'today')">Bilancia</button>
    <button onclick="getOroscopo('scorpione', 'today')">Scorpione</button>
    <button onclick="getOroscopo('sagittario', 'today')">Sagittario</button>
    <button onclick="getOroscopo('capricorno', 'today')">Capricorno</button>
    <button onclick="getOroscopo('acquario', 'today')">Acquario</button>
    <button onclick="getOroscopo('pesci', 'today')">Pesci</button>

    <div id="risposta"></div>
  </div>

</div>

<footer>
  <p>Creato da Alessandro Memmola © 2026 – AskingStars è open source (licenza MIT)</p>
  <p>
    <a href="https://alessandromemmola.com">Sito personale</a> ·
    <a href="https://github.com/alessandromemmola" target="_blank">GitHub</a> ·
    <a href="https://www.linkedin.com/in/alessandro-memmola-233868372/" target="_blank">LinkedIn</a> ·
    <a href="https://x.com/alexmemmola" target="_blank">X</a>
  </p>
</footer>

<script>
async function getOroscopo(segno, giorno = 'today') {
  const rispostaDiv = document.getElementById('risposta');
  rispostaDiv.innerHTML = '<em>Caricamento...</em>';

  if (giorno === 'today') {
    // Chiamata al proxy Vercel (chiave nascosta)
    const apiUrl = `/api/ninjas-horoscope?zodiac=${segno}`;

    try {
      const res = await fetch(apiUrl);

      if (!res.ok) {
        throw new Error(`Errore HTTP ${res.status}`);
      }

      const text = await res.text(); // prima prendiamo come testo

      try {
        const data = JSON.parse(text);
        if (data.error) {
          rispostaDiv.innerHTML = `<strong>Errore:</strong> ${data.error}`;
        } else {
          rispostaDiv.innerHTML = `
            <strong>${data.sign || segno}</strong><br>
            <em>${data.horoscope || 'Nessun oroscopo disponibile'}</em>
          `;
        }
      } catch (jsonErr) {
        console.error('Errore JSON:', jsonErr, 'Risposta:', text);
        rispostaDiv.innerHTML = `<strong>Errore:</strong> Risposta non valida dal server<br><small>${text.substring(0, 200)}...</small>`;
      }
    } catch (err) {
      console.error('Errore fetch:', err);
      rispostaDiv.innerHTML = `<strong>Errore:</strong> Impossibile contattare il servizio<br><small>${err.message}</small>`;
    }
  } else {
    // Cartomante – versione locale (nessuna API)
    const cartomanteRisposte = [
      "Le stelle dicono: oggi è il giorno giusto per fare casino.",
      "La cartomante vede... un caffè versato e un'opportunità persa.",
      "Attento al tuo ex che torna a chiedere scusa (spoiler: non cambiare).",
      "Oggi Marte è incazzato: evita discussioni inutili.",
      "Giove ti sorride... ma solo se paghi il caffè a qualcuno.",
      // ... aggiungi altre se vuoi
    ];

    const frase = cartomanteRisposte[Math.floor(Math.random() * cartomanteRisposte.length)];
    rispostaDiv.innerHTML = `<em>La cartomante sussurra:</em><br>${frase}`;
  }
}
</script>

</body>
</html>
